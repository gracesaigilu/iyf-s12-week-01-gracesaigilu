<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact me through my portfolio">
    <title>My Portfolio | Contact</title>
    <link rel="stylesheet" href="styles.css">
    
    
</head>

<body>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Send Me a Message</h2>

            <p>
                If you would like to contact me, fill in the form below.
            </p>

            <form action="https://formspree.io/f/mbgdrngo" method="POST">

                <div>
                    <label for="name">Full Name:</label>
                    <br>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        autocomplete="name"
                    >
                </div>

                <br>

                <div>
                    <label for="email">Email Address:</label>
                    <br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </div>

                <br>

                <div>
                    <label for="subject">Subject:</label>
                    <br>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="message">Your Message:</label>
                    <br>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                        required
                    ></textarea>
                </div>

                <br>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Programming Portfolio</p>
    </footer>

</body>

</html>
