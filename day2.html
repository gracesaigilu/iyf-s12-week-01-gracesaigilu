<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>

    <style>
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #222;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">Grace's Portfolio</div>

        <div>
            <a href="index.html">Home</a>
            <a href="blog.html">Blog</a>
            <a href="day1.html">Challenges</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <main>
        <h1>Navigation Menu Challenge</h1>

        <p>
            This page demonstrates a navigation menu using the
            semantic HTML <code>&lt;nav&gt;</code> element.
        </p>
    </main>

    <section id="contact">
        <h2>Contact</h2>
        <p>Thank you for visiting my website.</p>
    </section>

</body>
</html>
