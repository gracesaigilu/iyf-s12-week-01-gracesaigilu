<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 30px auto;
        }

        figure {
            margin: 0;
            text-align: center;
        }

        figure img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        figcaption {
            padding: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>A collection of six placeholder images.</p>
    </header>

    <main>

        <section class="gallery">

            <figure>
                <img src="https://placehold.co/600x400?text=Image+1"
                     alt="Placeholder image 1">
                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/600x400?text=Image+2"
                     alt="Placeholder image 2">
                <figcaption>City Life</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/600x400?text=Image+3"
                     alt="Placeholder image 3">
                <figcaption>Travel Adventure</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/600x400?text=Image+4"
                     alt="Placeholder image 4">
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/600x400?text=Image+5"
                     alt="Placeholder image 5">
                <figcaption>Ocean View</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/600x400?text=Image+6"
                     alt="Placeholder image 6">
                <figcaption>Sunset</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Grace Kaisai</p>
    </footer>

</body>
</html>
